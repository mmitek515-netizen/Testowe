# Debian 13 / Docker Compose. Ollama stays inside the private Compose network.
# Launch with: docker compose up -d --build
services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama
    expose:
      - "11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 20s

  ollama-pull:
    image: ollama/ollama:latest
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull ${OLLAMA_MODEL:-llama2-uncensored:7b}"]

  # Optional local, persistent Ollama task worker imported from AI System Linux.
  # It is NOT authenticated as any of the four original external agents.
  agent-rest:
    profiles: ["agents"]
    image: python:3.12-alpine
    restart: unless-stopped
    working_dir: /app
    command: ["python", "-u", "integrations/agent-rest/agent_rest.py"]
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      AGENT_API_TOKEN: ${AGENT_API_TOKEN:-}
      AGENT_MODEL: ${OLLAMA_MODEL:-llama2-uncensored:7b}
      AGENT_API_PORT: "8091"
      AGENT_DB_PATH: /data/agent_tasks.sqlite3
      OLLAMA_BASE_URL: http://ollama:11434
    volumes:
      - ./integrations/agent-rest:/app/integrations/agent-rest:ro
      - agent_tasks_data:/data
    expose:
      - "8091"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  ai-linux-control:
    build: .
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: 3000
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama2-uncensored:7b}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      MISSIONS_FILE: /data/missions.json
      AGENT_API_URL: http://agent-rest:8091
      AGENT_API_TOKEN: ${AGENT_API_TOKEN:-}
    volumes:
      - missions_data:/data

volumes:
  ollama_models:
  missions_data:
  agent_tasks_data:
