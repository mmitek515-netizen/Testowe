# Debian 13 / Docker Compose. Ollama stays inside the private Compose network.
# Launch with: docker compose up -d --build
services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama
    expose:
      - "11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 20s

  ollama-pull:
    image: ollama/ollama:latest
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull ${OLLAMA_MODEL:-llama2-uncensored:7b}"]

  # Optional local, persistent Ollama task worker imported from AI System Linux.
  # It is NOT authenticated as any of the four original external agents.
  agent-rest:
    profiles: ["agents"]
    image: python:3.12-alpine
    restart: unless-stopped
    working_dir: /app
    command: ["python", "-u", "integrations/agent-rest/agent_rest.py"]
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      AGENT_API_TOKEN: ${AGENT_API_TOKEN:-}
      AGENT_MODEL: ${OLLAMA_MODEL:-llama2-uncensored:7b}
      AGENT_API_PORT: "8091"
      AGENT_DB_PATH: /data/agent_tasks.sqlite3
      OLLAMA_BASE_URL: http://ollama:11434
    volumes:
      - ./integrations/agent-rest:/app/integrations/agent-rest:ro
      - agent_tasks_data:/data
    expose:
      - "8091"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # Real Debian 13 userspace API imported from Debian_13. No claim of a bootable OS.
  # Enabled only with --profile debian13; NOT publicly published on the host.
  debian13-system:
    profiles: ["debian13"]
    build:
      context: ./debian13/system
    image: testowe-debian13-system:local
    init: true
    user: "10001:10001"
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      DEBIAN13_API_TOKEN: ${DEBIAN13_API_TOKEN:-}
      # Internal Ollama implements the OpenAI chat-completions interface.
      MODEL_CHAT_URL: ${MODEL_CHAT_URL:-http://ollama:11434/v1/chat/completions}
      MODEL_API_KEY: ${MODEL_API_KEY:-ollama-local}
      MODEL_NAME: ${MODEL_NAME:-llama2-uncensored:7b}
      DEBIAN13_ALLOW_INTERNAL_OLLAMA: "1"
      HOST: 0.0.0.0
      PORT: "8080"
      WORKSPACE_DIR: /workspace
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2).read()"]
      interval: 15s
      timeout: 4s
      retries: 3
      start_period: 10s
    volumes:
      - debian13_workspace:/workspace
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 512m
    cpus: 1.0

  ai-linux-control:
    build: .
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: 3000
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama2-uncensored:7b}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      MISSIONS_FILE: /data/missions.json
      AGENT_API_URL: http://agent-rest:8091
      AGENT_API_TOKEN: ${AGENT_API_TOKEN:-}
      DEBIAN13_SYSTEM_API_URL: http://debian13-system:8080
      DEBIAN13_API_TOKEN: ${DEBIAN13_API_TOKEN:-}
    volumes:
      - missions_data:/data

volumes:
  ollama_models:
  missions_data:
  agent_tasks_data:
  debian13_workspace:
